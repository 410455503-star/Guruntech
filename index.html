<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="固润工程项目管理系统 - 高效管理工程项目、跟踪任务进度">

  <script src="js/components/login.js"></script>
  
  <script>
    router.addRoute('dashboard', (route) => {
      store.setState({ currentRoute: 'dashboard', currentProjectId: null });
      renderSidebar();
      renderHeader();

      renderContent();
    });
    
    router.addRoute('projects/:id', (route) => {
      const projectId = route.params.id;
      store.setState({ currentRoute: 'projects', currentProjectId: projectId });
      renderSidebar();

    });
    
    router.addRoute('materials', (route) => {
      store.setState({ currentRoute: 'materials', currentProjectId: null });

      renderHeader();
      renderContent();
    });
    
    router.addRoute('afterSale', (route) => {
      store.setState({ currentRoute: 'afterSale', currentProjectId: null });
      renderSidebar();
      renderHeader();
      renderContent();
    });
    
    router.addRoute('temporaryWorkers', (route) => {

    router.addRoute('settings', (route) => {
      store.setState({ currentRoute: 'settings', currentProjectId: null });
      renderSidebar();
      renderHeader();
      renderContent();
    });
    
    router.addRoute('*', (route) => {
      router.navigate('dashboard');
    });
    
    window.addEventListener('load', () => {
      console.log('固润工程项目管理系统已加载');
      console.log('当前版本: 1.0.0');
      
      // 订阅状态变化
      store.subscribe(() => {
        renderSidebar();
        renderHeader();
      });
      
      // 初始化路由
      router.init();
      
      const state = store.getState();
      const isLoggedIn = state.isLoggedIn;
      if (isLoggedIn) {
        const isDarkMode = state.darkMode;
        if (isDarkMode) {
          document.body.classList.add('dark-mode');
        }
        renderSidebar();
        renderHeader();
        renderContent();
        
        checkExpiringTasks();
        setInterval(checkExpiringTasks, 60 * 60 * 1000);
      } else {
        renderLogin();
      }
    });
    
    function checkExpiringTasks() {
      const expiringTasks = store.checkExpiringTasks();
      if (expiringTasks.length > 0) {
        expiringTasks.forEach(task => {
          const assignee = store.getUserById(task.assigneeId);
          const project = store.getProjectById(task.projectId);
          const today = new Date();
          const dueDate = new Date(task.dueDate);
          const daysUntilDue = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
          
          store.addNotification({
            type: 'warning',
            title: '任务即将到期',
            message: `任务"${task.name}"还有${daysUntilDue}天到期，负责人：${assignee?.name || '未分配'}，所属项目：${project?.name || '未知项目'}`
          });
        });
      }
    }
    
    window.addEventListener('error', (e) => {
      console.error('系统错误:', e.error);
    });
    
    window.addEventListener('unhandledrejection', (e) => {
      console.warn('未处理的Promise拒绝:', e.reason);
      e.preventDefault();
    });
    
    window.addEventListener('message', (e) => {
      if (e.source !== window) {
        try {
          const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
          console.debug('收到消息:', data);
        } catch (err) {
          console.warn('消息解析失败:', err);
        }
      }
    });
  </script>
</body>
</html>
